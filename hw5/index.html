<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Scrabble Game</title>
    <meta charset="utf-8">
    <link href="CSS/style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- wrapper bootstrap container -->
    <div id="wrapper" class="container">
        <p id="parTitle" class="col-8">Mini Scrabble Game!</p>
        <!-- div for information on how to play the game  -->
        <div id="information" class="container col-6">
            <p id="how2play">How do I play?</p>
            <p>Try to get the highest possible score by forming words with the available tiles. Place 
                the tiles from left to right, with no gaps between them. Once you have a valid word, 
                simply submit and keep going. If you get stuck, just reset!</p>
        </div>
        <!-- div with the two main buttons for the game -->
        <div id="buttons-container" class="buttons-container">
            <button id="resetButton" class="game-button btn btn-warning">Reset Game</button>
            <button id="submitButton" class="game-button btn btn-success">Submit Word</button>
        </div>
        <!-- alert box for failure/success upon clicking submit  -->
        <p id="textresult" class="col-2 alert alert-success"></p>
        <!-- div for displaying the score  -->
        <div id="scoreDisplay" class="score-display">Score: 0</div>
        <!-- dynamic div that holds the tiles  -->
        <div id="tileHolder" class="tile-holder"></div>
        <!-- div for the board and board-cells that hold the tiles  -->
        <div id="board" class="board">
            <div class="board-cell" id="cell-1"></div>
            <div class="board-cell" id="cell-2"></div>
            <div class="board-cell" id="cell-3"></div>
            <div class="board-cell" id="cell-4"></div>
            <div class="board-cell" id="cell-5"></div>
            <div class="board-cell" id="cell-6"></div>
            <div class="board-cell" id="cell-7"></div>
        </div>        
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script src="JS/script.js"></script>
</body>
</html>
